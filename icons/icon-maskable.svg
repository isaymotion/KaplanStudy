<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="0.32" cy="0.28" r="0.95">
      <stop offset="0" stop-color="#4253a8"/>
      <stop offset="0.45" stop-color="#2a3279"/>
      <stop offset="1" stop-color="#151a46"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#c9d2ff" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9aa8ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5c6ad6" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="370" y1="320" x2="520" y2="470">
      <stop offset="0" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="rmask"><rect x="-200" y="-200" width="1000" height="1000" fill="url(#fade)"/></mask>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/><g transform="translate(25.6 25.6) scale(0.9)">
  <!-- incoming white beam -->
  <polygon points="-88,-90 -60,-113 156,250 140,270" fill="url(#beam)" filter="url(#soft)"/>
  <!-- rainbow fan (red top, violet bottom) -->
  <g mask="url(#rmask)" filter="url(#soft)" opacity="0.95">
    <polygon points="372,300 378,306 648,393 653,338" fill="#ff4d5e"/>
    <polygon points="378,306 384,312 642,456 648,393" fill="#ff8a3d"/>
    <polygon points="384,312 390,318 637,527 642,456" fill="#ffd23f"/>
    <polygon points="390,318 396,324 632,609 637,527" fill="#4fd17a"/>
    <polygon points="396,324 402,330 611,691 632,609" fill="#3fa2ff"/>
    <polygon points="402,330 408,336 499,686 611,691" fill="#8a5cff"/>
    </g>
  <!-- prism: side face, front face -->
  <polygon points="236,86 298,58 452,356 390,392" fill="url(#side)"/>
  <polygon points="236,86 76,392 390,392" fill="url(#front)"/>
  <!-- refracted beam inside glass -->
  <polygon points="146,258 156,250 392,312 380,322" fill="url(#inner)" filter="url(#soft)"/>
  <!-- base sheen -->
  <polygon points="96,380 384,380 390,392 76,392" fill="#ffffff" opacity="0.12"/>
  <!-- edges -->
  <g fill="none" stroke="#ffffff" stroke-linejoin="round" stroke-linecap="round">
    <polyline points="76,392 236,86 390,392 76,392" stroke-width="5" stroke-opacity="0.9"/>
    <polyline points="236,86 298,58 452,356 390,392" stroke-width="4" stroke-opacity="0.75"/>
    <line x1="232" y1="128" x2="128" y2="332" stroke-width="7" stroke-opacity="0.35"/>
  </g>
  <circle cx="236" cy="86" r="14" fill="#ffffff" opacity="0.35" filter="url(#glow)"/>
  <circle cx="236" cy="86" r="7" fill="#ffffff"/>

</g></svg>